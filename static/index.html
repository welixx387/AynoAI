<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AynoAI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AD%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="app">

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <button id="new-chat-btn" class="new-chat-btn">+ Новый диалог</button>
      <button id="sidebar-close" class="icon-btn sidebar-close" aria-label="Закрыть меню">✕</button>
    </div>
    <div id="conversation-list" class="conversation-list"></div>
    <div class="sidebar-footer">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text">проверка соединения…</span>
    </div>
  </aside>

  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <main class="chat">
    <header class="chat-header">
      <button id="menu-toggle" class="icon-btn menu-toggle" aria-label="Меню">☰</button>
      <div class="persona">
        <div class="persona-avatar">Ay</div>
        <div>
          <div class="persona-name">AynoAI</div>
          <div class="persona-subtitle">ИИ-стратег с макиавеллистским складом ума. Ролевой персонаж, не настоящий человек.</div>
        </div>
      </div>
      <button id="settings-btn" class="icon-btn" aria-label="Настройки">⚙</button>
    </header>

    <div id="messages" class="messages">
      <div class="messages-inner" id="messages-inner">
        <div class="empty-state" id="empty-state">
          <div class="empty-emoji">🎭</div>
          <h2 class="empty-title">AynoAI</h2>
          <p>Начни диалог — просто напиши сообщение внизу, или выбери тему:</p>
          <div class="suggestion-chips">
            <button type="button" class="chip" data-prompt="Дай совет по переговорам со сложным партнёром.">Переговоры</button>
            <button type="button" class="chip" data-prompt="Как выстроить репутацию эксперта в своей сфере?">Репутация</button>
            <button type="button" class="chip" data-prompt="Расскажи о своём подходе к стратегии.">О тебе</button>
          </div>
        </div>
      </div>
    </div>

    <div class="input-bar">
      <form id="chat-form" class="chat-form">
        <textarea id="chat-input" placeholder="Напиши сообщение…" rows="1"></textarea>
        <button type="submit" id="send-btn" class="send-btn" aria-label="Отправить">➤</button>
      </form>
    </div>
  </main>
</div>

<div id="settings-panel" class="settings-panel hidden">
  <div class="settings-content">
    <div class="settings-title-row">
      <h3>Настройки</h3>
      <button id="settings-close" class="icon-btn" aria-label="Закрыть">✕</button>
    </div>

    <label class="settings-field">
      Модель
      <select id="model-select"></select>
    </label>

    <label class="settings-field">
      Температура: <span id="temp-value">0.8</span>
      <input type="range" id="temp-slider" min="0" max="1.5" step="0.05" value="0.8" />
    </label>

    <p class="settings-hint">
      Выше температура — более неожиданные и «творческие» ответы, ниже — более
      предсказуемые и строгие.
    </p>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
